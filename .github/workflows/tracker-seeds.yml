name: Refresh official address list
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/tracker-seeds.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/tracker-seeds.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/tracker-seeds.json
            git commit -m "Refresh official address list"
            git push
          fi
