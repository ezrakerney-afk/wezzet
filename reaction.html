<style>.logo .logo-dark{display:none}:root[data-theme="dark"] .logo .logo-light{display:none}:root[data-theme="dark"] .logo .logo-dark{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-light{display:none}:root:not([data-theme="light"]) .logo .logo-dark{display:block}}</style>

</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img class="logo-light" src="/assets/logo.png" alt="Wezzet" width="113" height="52"><img class="logo-dark" src="/assets/logo-dark.png" alt="Wezzet" width="113" height="52"></a>
    <nav class="site-nav" aria-label="Main"><a href="/">All tools</a><button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>Reaction time test</h1>
      <p class="lede">Click as soon as the box turns green. How fast are you?</p>
    </div>
<button type="button" id="box" style="width:100%;height:260px;border:0;border-radius:12px;font-size:1.4rem;cursor:pointer;background:#c0392b;color:#fff">Click to start</button><div class="stats" aria-live="polite"><div class="stat"><b id="last">-</b><span>Last (ms)</span></div><div class="stat"><b id="best">-</b><span>Best (ms)</span></div><div class="stat"><b id="avg">-</b><span>Average (ms)</span></div></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><a href="/">Wezzet</a> · Follow <a href="https://x.com/WezzetX" rel="noopener">@WezzetX</a> on X.</p>
  </div>
</footer>
<script>(()=>{const $=(i)=>document.getElementById(i);
let st="idle",t=0,to=0;const all=[];const b=$("box");
const set=(c,s)=>{b.style.background=c;b.textContent=s};
b.onclick=()=>{if(st==="idle"||st==="done"){st="wait";set("#c0392b","Wait for green...");to=setTimeout(()=>{st="go";t=performance.now();set("#27ae60","Click!")},1500+Math.random()*3000)}
else if(st==="wait"){clearTimeout(to);st="done";set("#7f8c8d","Too soon. Click to try again")}
else{const ms=Math.round(performance.now()-t);all.push(ms);st="done";set("#2c3e50",ms+" ms. Click to go again");$("last").textContent=ms;$("best").textContent=Math.min(...all);$("avg").textContent=Math.round(all.reduce((a,c)=>a+c)/all.length)}};
})();</script>
<script src="/assets/theme.js?v=4" defer></script>
</body>
</html>
