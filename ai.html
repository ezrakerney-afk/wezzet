<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WezzetAI: Free AI Assistant with Live Web Search | Wezzet</title>
<meta name="description" content="Ask WezzetAI anything, including today's news. It searches the web live and points you to the right free Wezzet tool.">
<link rel="canonical" href="https://wezzet.com/ai">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wezzet">
<meta property="og:title" content="WezzetAI: Free AI Assistant with Live Web Search | Wezzet">
<meta property="og:url" content="https://wezzet.com/ai">
<meta property="og:image" content="https://wezzet.com/assets/og/convert.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://wezzet.com/assets/og/convert.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>try{(function(t){if(t==="dark"||t==="light")document.documentElement.dataset.theme=t})(localStorage.getItem("wz-theme"))}catch(e){}</script>
<style>.logo .logo-dark{display:none}:root[data-theme="dark"] .logo .logo-light{display:none}:root[data-theme="dark"] .logo .logo-dark{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-light{display:none}:root:not([data-theme="light"]) .logo .logo-dark{display:block}}</style>
<link rel="stylesheet" href="/assets/site.css?v=5">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img class="logo-light" src="/assets/logo.png" alt="Wezzet" width="113" height="52"><img class="logo-dark" src="/assets/logo-dark.png" alt="Wezzet" width="113" height="52"></a>
    <nav class="site-nav" aria-label="Main"><a href="/">All tools</a><button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>WezzetAI</h1>
      <p>Ask anything, including the news, or drop a file.</p>
    </div>
    <style>
      .ai-card{border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
      .ai-card.dragging{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
      .ai-log{display:flex;flex-direction:column;gap:12px;padding:16px;min-height:280px;max-height:62vh;overflow-y:auto}
      .ai-msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5}
      .ai-body{overflow-wrap:anywhere}.ai-body p{margin:0 0 8px}.ai-body p:last-child{margin:0}.ai-body ul{margin:4px 0 8px;padding-left:20px}.ai-body li{margin:3px 0}.ai-body code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:.92em}.ai-body a{color:inherit;text-decoration:underline}
      .ai-src{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px}.ai-src a{color:var(--ink-soft)}
      .ai-msg .row-actions{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
      .ai-msg .row-actions .btn{padding:6px 10px;font-size:14px}
      .ai-bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
      .ai-you{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
      .ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--bg)}
      .ai-form input{flex:1;min-width:0}
      .ai-attach{flex:none}
      .ai-hint{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
    </style>
    <div class="ai-card" id="drop">
      <div class="ai-log" id="log" aria-live="polite"></div>
      <form class="ai-form" id="ask">
        <button class="btn btn-quiet ai-attach" type="button" id="choose" aria-label="Add a file" title="Add a file">+</button>
        <input id="q" autocomplete="off" placeholder="Ask anything, or e.g. turn a mov into mp4" aria-label="Ask WezzetAI">
        <button class="btn" type="submit">Send</button>
      </form>
      <input type="file" id="files" multiple hidden>
    </div>
    <p class="ai-hint">You can also drop a file anywhere on this box. Files never leave your device.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><a href="/">Wezzet</a> · Follow <a href="https://x.com/WezzetX" rel="noopener">@WezzetX</a> on X.</p>
  </div>
</footer>
<script src="/assets/handoff.js?v=1" defer></script>
<script src="/assets/ai.js?v=6" defer></script>
<script src="/assets/theme.js?v=4" defer></script>
</body>
</html>
