<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | Wezzet</title>
<meta name="description" content="Free chat on Wezzet: text channels, direct messages and 1-on-1 voice calls in your browser.">
<link rel="canonical" href="https://wezzet.com/chat">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wezzet">
<meta property="og:title" content="Chat | Wezzet">
<meta property="og:url" content="https://wezzet.com/chat">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>try{(function(t){if(t==="dark"||t==="light")document.documentElement.dataset.theme=t})(localStorage.getItem("wz-theme"))}catch(e){}</script>
<style>.logo .logo-dark{display:none}:root[data-theme="dark"] .logo .logo-light{display:none}:root[data-theme="dark"] .logo .logo-dark{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-light{display:none}:root:not([data-theme="light"]) .logo .logo-dark{display:block}}</style>
<link rel="stylesheet" href="/assets/site.css?v=3">
<style>
  .chat-app { display: grid; gap: 16px; margin-top: 20px; }
  @media (min-width: 760px) { .chat-app { grid-template-columns: 220px 1fr; } }
  .side { display: grid; gap: 14px; align-content: start; }
  .side h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin: 0 0 4px; }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side button.room { width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .side button.room:hover, .side button.room[aria-current="true"] { background: var(--surface); }
  .side .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); margin-right: 6px; }
  .side .dot.on { background: var(--good); }
  .side form { display: flex; gap: 6px; }
  .side input { min-height: 38px; }
  .pane { border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-rows: auto 1fr auto; height: min(70vh, 640px); min-width: 0; }
  .pane-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .pane-head h2 { font-size: 1.05rem; margin: 0; margin-right: auto; }
  .pane-head .btn { min-height: 36px; padding: 0 12px; font-size: .9rem; }
  .log { overflow-y: auto; padding: 8px 12px; }
  .msg { padding: 6px 0; }
  .msg b { margin-right: 6px; }
  .msg time { font-size: .8rem; color: var(--ink-soft); }
  .msg .t { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .rep { border: 0; background: none; color: var(--ink-soft); font-size: .8rem; cursor: pointer; visibility: hidden; }
  .msg:hover .rep, .msg .rep:focus { visibility: visible; }
  .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; min-height: 46px; max-height: 160px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-strong); font: inherit; color: var(--ink); background: var(--bg); resize: none; }
  .call { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .call .btn { min-height: 36px; padding: 0 12px; }
  .auth { max-width: 420px; display: grid; gap: 14px; margin-top: 20px; }
  .auth input[type="password"] { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); font: inherit; }
  .note.error { color: var(--bad); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img class="logo-light" src="/assets/logo.png" alt="Wezzet" width="113" height="52"><img class="logo-dark" src="/assets/logo-dark.png" alt="Wezzet" width="113" height="52"></a>
    <nav class="site-nav" aria-label="Main"><a href="/">All tools</a><button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="tool-head" style="padding-bottom:0">
      <h1>Chat</h1>
      <p class="lede">Channels, direct messages and voice calls. Free, in your browser.</p>
    </div>

    <form class="auth" id="auth" hidden novalidate>
      <div class="segmented" role="radiogroup" aria-label="Sign in or sign up">
        <label><input type="radio" name="mode" value="login" checked><span>Sign in</span></label>
        <label><input type="radio" name="mode" value="signup"><span>Sign up</span></label>
      </div>
      <div class="field"><label for="a-name">Name</label><input type="text" id="a-name" maxlength="24" autocomplete="username" required></div>
      <div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" maxlength="200" autocomplete="current-password" required></div>
      <label class="check" id="age-row" hidden><input type="checkbox" id="a-age"> I'm 13 or older</label>
      <button class="btn" type="submit" id="a-go">Sign in</button>
      <p class="note error" id="a-err" role="alert" hidden></p>
      <p class="rules">No email needed. Be kind. Messages reported by several people are hidden.</p>
    </form>

    <div class="chat-app" id="app" hidden>
      <aside class="side">
        <div><h2>Channels</h2><ul id="channels"></ul></div>
        <div><h2>Direct messages</h2><ul id="dms"></ul></div>
        <form id="dm-form"><input type="text" id="dm-name" placeholder="Name" maxlength="24" aria-label="Message someone by name"><button class="btn btn-quiet" type="submit" style="min-height:38px;padding:0 12px">DM</button></form>
        <p class="meta">Signed in as <b id="me-name"></b> &middot; <a href="#" id="logout">Sign out</a></p>
      </aside>
      <section class="pane" aria-live="polite">
        <div>
          <div class="pane-head"><h2 id="room-title"></h2>
            <button class="btn btn-quiet" type="button" id="call-btn" hidden>Call</button>
            <button class="btn btn-quiet" type="button" id="block-btn" hidden>Block</button>
          </div>
          <div class="call" id="call-bar" hidden><span id="call-text"></span>
            <button class="btn" type="button" id="accept-btn" hidden>Answer</button>
            <button class="btn btn-quiet" type="button" id="mute-btn" hidden>Mute</button>
            <button class="btn btn-quiet" type="button" id="hang-btn">Hang up</button>
          </div>
        </div>
        <div class="log" id="log"></div>
        <form class="composer" id="send-form"><textarea id="text" maxlength="2000" placeholder="Message" aria-label="Message"></textarea><button class="btn" type="submit">Send</button></form>
      </section>
    </div>
    <audio id="remote-audio" autoplay></audio>
    <p class="note error" id="err" role="alert" hidden></p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><a href="/">Wezzet</a>: free tools that run in your browser.</p>
  </div>
</footer>
<script src="/assets/chat.js?v=1" defer></script>
<script src="/assets/theme.js?v=3" defer></script>
</body>
</html>
