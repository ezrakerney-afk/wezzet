<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Formatter and Validator | Wezzet</title>
<meta name="description" content="Format, validate and minify JSON in your browser. Shows the line and column of any error. Nothing is uploaded.">
<link rel="canonical" href="https://wezzet.com/json">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wezzet">
<meta property="og:title" content="JSON Formatter and Validator | Wezzet">
<meta property="og:url" content="https://wezzet.com/json">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>try{(function(t){if(t==="dark"||t==="light")document.documentElement.dataset.theme=t})(localStorage.getItem("wz-theme"))}catch(e){}</script>
<style>.logo .logo-dark{display:none}:root[data-theme="dark"] .logo .logo-light{display:none}:root[data-theme="dark"] .logo .logo-dark{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-light{display:none}:root:not([data-theme="light"]) .logo .logo-dark{display:block}}</style>
<link rel="stylesheet" href="/assets/site.css?v=3">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img class="logo-light" src="/assets/logo.png" alt="Wezzet" width="113" height="52"><img class="logo-dark" src="/assets/logo-dark.png" alt="Wezzet" width="113" height="52"></a>
    <nav class="site-nav" aria-label="Main"><a href="/">All tools</a><button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>JSON formatter</h1>
    </div>

    <textarea id="t" class="big mono" spellcheck="false" placeholder='{"paste": "your JSON here"}' aria-label="JSON" style="min-height:320px"></textarea>
    <div class="btn-row">
      <button class="btn" type="button" id="fmt">Format</button>
      <button class="btn btn-quiet" type="button" id="min">Minify</button>
      <button class="btn btn-quiet" type="button" id="copy">Copy</button>
      <select id="indent" aria-label="Indent" style="width:auto"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tabs</option></select>
    </div>
    <p class="note" id="msg" role="status" hidden></p>
    <section class="section faq" aria-labelledby="faq">
      <h2 id="faq">Questions</h2>
      <details><summary>Is my JSON sent to a server?</summary><p>No. It&#x27;s checked and formatted in your browser, so it&#x27;s safe for private data.</p></details>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><a href="/">Wezzet</a>: free tools that run in your browser.</p>
  </div>
</footer>
<script src="/assets/json.js?v=3" defer></script>
<script src="/assets/theme.js?v=3" defer></script>
</body>
</html>
