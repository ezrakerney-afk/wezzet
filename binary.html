<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>Text to binary</h1>
      <p class="lede">Turn text into binary, hex or base64 and back.</p>
    </div>
<div class="field"><label for="t">Text</label><textarea id="t" rows="5" placeholder="hi" style="width:100%"></textarea></div><div class="field"><label for="f">Format</label><select id="f"><option value="2">Binary</option><option value="16">Hex</option><option value="b64">Base64</option></select></div><div class="field"><label for="o">Encoded</label><textarea id="o" rows="5" placeholder="" style="width:100%"></textarea></div>
  </div>
</main>

<script>(()=>{const $=(i)=>document.getElementById(i);
const enc=new TextEncoder(),dec=new TextDecoder();
const go=()=>{const b=enc.encode($("t").value),f=$("f").value;$("o").value=f==="b64"?btoa(String.fromCharCode(...b)):[...b].map(x=>x.toString(+f).padStart(f==="2"?8:2,"0")).join(" ")};
$("t").oninput=go;$("f").onchange=go;
$("o").oninput=()=>{try{const f=$("f").value,v=$("o").value.trim();const b=f==="b64"?Uint8Array.from(atob(v),c=>c.charCodeAt(0)):Uint8Array.from(v.split(/\s+/).filter(Boolean),x=>parseInt(x,+f));$("t").value=dec.decode(b)}catch(e){}};go();
})();</script>
