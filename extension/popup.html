<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; border: 1px solid #333; background: #1b1b1b; color: #eee; font: inherit; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  a { display: block; padding: 7px 8px; border-radius: 6px; color: #eee; text-decoration: none; }
  a:hover, a.on { background: #2a2140; }
  .foot { margin-top: 8px; font-size: 12px; color: #999; }
</style>
<input id="q" placeholder="what do you need? e.g. heic to jpg" autofocus>
<ul id="list"></ul>
<p class="foot">Right-click any image, video or link and pick "Convert with Wezzet".</p>
<script src="popup.js"></script>
