<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>Tip calculator</h1>
    </div>

    <div class="tight" style="display:grid;gap:16px">
      <div class="field"><label for="bill">Bill amount</label><input type="number" id="bill" min="0" step="0.01" placeholder="0.00" inputmode="decimal"></div>
      <div class="field"><span class="label">Tip</span>
        <div class="segmented" role="radiogroup" aria-label="Tip percent" style="justify-self:start">
          <label><input type="radio" name="pct" value="15"><span>15%</span></label>
          <label><input type="radio" name="pct" value="18"><span>18%</span></label>
          <label><input type="radio" name="pct" value="20" checked><span>20%</span></label>
          <label><input type="radio" name="pct" value="25"><span>25%</span></label>
          <label><input type="radio" name="pct" value="custom"><span>Other</span></label>
        </div>
        <input type="number" id="custom" min="0" placeholder="Tip %" hidden style="max-width:140px">
      </div>
      <div class="field"><label for="people">People</label><input type="number" id="people" min="1" value="1" style="max-width:140px"></div>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="tip">0.00</b><span>Tip</span></div>
      <div class="stat"><b id="total">0.00</b><span>Total</span></div>
      <div class="stat"><b id="each">0.00</b><span>Each person</span></div>
